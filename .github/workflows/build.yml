name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2025

    env:
      PYTHONHOME: ""
      PYTHONPATH: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PythonVista 3.14.10
        shell: pwsh
        run: |
          $url = "https://github.com/adang1345/PythonVista/releases/download/v3.14.10/python-3.14.10-amd64-full.exe"
          Invoke-WebRequest $url -OutFile python-installer.exe

      - name: Remove existing Python 3.14 registry entries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $keys = @(
            "HKLM\SOFTWARE\Python\PythonCore\3.14",
            "HKCU\SOFTWARE\Python\PythonCore\3.14"
          )

          foreach ($key in $keys) {
            foreach ($view in @("32", "64")) {
              Write-Host "Checking $key ($view-bit view)"

              & reg.exe query $key /reg:$view 2>$null

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Removing $key ($view-bit view)"
                & reg.exe delete $key /f /reg:$view

                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove $key ($view-bit view)"
                }
              } else {
                Write-Host "Not found: $key ($view-bit view)"
              }
            }
          }

      - name: Install PythonVista
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $log = "$env:RUNNER_TEMP\pythonvista-install.log"

          $args = "/quiet /log `"$log`" InstallAllUsers=1 TargetDir=C:\Python314 PrependPath=0 Include_lib=1 Include_exe=1 Include_dev=1 Include_pip=1 Include_test=0"

          $process = Start-Process -FilePath ".\python-installer.exe" `
            -ArgumentList $args `
            -Wait -PassThru -NoNewWindow

          Write-Host "=== Installer exit code ==="
          Write-Host $process.ExitCode

          Write-Host "=== Installation directory ==="
          Get-ChildItem "C:\Python314" -Force

          Write-Host "=== Standard library ==="
          if (Test-Path "C:\Python314\Lib") {
            Get-ChildItem "C:\Python314\Lib" -Force |
              Select-Object -First 20
          } else {
            Write-Host "Lib directory not found"
          }

          Write-Host "=== Installer log (last 100 lines) ==="
          if (Test-Path $log) {
            Get-Content $log -Tail 100
          } else {
            Write-Host "Installer log not found"
          }

          if ($process.ExitCode -ne 0) {
            throw "PythonVista installer failed with exit code $($process.ExitCode)"
          }

          if (!(Test-Path "C:\Python314\Lib\os.py")) {
            throw "PythonVista standard library was not installed"
          }

          C:\Python314\python.exe --version

      - name: Upload PythonVista installer logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pythonvista-install-logs
          path: ${{ runner.temp }}\pythonvista-install*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          C:\Python314\python.exe -c "import sys, struct, os; print('Executable:', sys.executable); print('Prefix:', sys.prefix); print('Base prefix:', sys.base_prefix); print('Architecture:', struct.calcsize('P') * 8); print('OS module:', os.__file__); print('Python path:', *sys.path, sep='\n')"

          if (!(Test-Path "C:\Python314\Lib\os.py")) {
            throw "Python standard library missing"
          }

          if (!(Test-Path "C:\Python314\DLLs")) {
            throw "Python DLLs directory missing"
          }

          C:\Python314\python.exe -m ensurepip --upgrade
          C:\Python314\python.exe -m pip --version

      - name: Install build requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          C:\Python314\python.exe -m venv C:\yt-dlp-build-venv

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python -m pip install --upgrade pip

          python -m pip install `
            -r bundle/requirements/pip.txt

          python -m pip install `
            -r bundle/requirements/win-x64-pyinstaller.txt

          python -m pip install `
            -r bundle/requirements/curl-cffi.txt

          python -m pip --version

      - name: Pin compatibility versions
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps pyinstaller==6.22.3
          python -m pip install --force-reinstall curl-cffi==0.17.0

          python -m pip show pyinstaller
          python -m pip show curl-cffi

      - name: Verify PyInstaller
        shell: pwsh
        run: |
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__); print('Location:', PyInstaller.__file__)"

          python -c "from PyInstaller.utils.win32 import winmanifest; print('PyInstaller Windows modules OK')"

      - name: Prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python devscripts/make_lazy_extractors.py

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python -m bundle.pyinstaller

          if (!(Test-Path "dist/yt-dlp.exe")) {
            throw "yt-dlp.exe was not generated"
          }

          Rename-Item `
            "dist/yt-dlp.exe" `
            "yt-dlp_win7.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          .\dist\yt-dlp_win7.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp_win7_x64
          path: dist/yt-dlp_win7.exe
          if-no-files-found: error
          retention-days: 30
