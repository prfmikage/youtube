name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2025

    env:
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHON_ROOT: "C:\hostedtoolcache\windows\Python\3.14.10\x64"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PythonVista 3.14.10
        shell: pwsh
        run: |
          $url = "https://github.com/adang1345/PythonVista/releases/download/v3.14.10/python-3.14.10-amd64-full.exe"
          Invoke-WebRequest $url -OutFile python-installer.exe

      - name: Remove existing Python 3.14 registry entries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $keys = @(
            "HKLM\SOFTWARE\Python\PythonCore\3.14",
            "HKCU\SOFTWARE\Python\PythonCore\3.14"
          )

          foreach ($key in $keys) {
            foreach ($view in @("32", "64")) {
              Write-Host "Checking $key (${view}-bit view)"

              & reg.exe query $key /reg:$view 2>$null
              $queryExitCode = $LASTEXITCODE

              if ($queryExitCode -eq 0) {
                Write-Host "Removing $key (${view}-bit view)"

                & reg.exe delete $key /f /reg:$view
                $deleteExitCode = $LASTEXITCODE

                if ($deleteExitCode -ne 0) {
                  throw "Failed to remove $key (${view}-bit view)"
                }

                Write-Host "Successfully removed $key (${view}-bit view)"
              } else {
                Write-Host "Not found: $key (${view}-bit view)"
              }
            }
          }

          Write-Host "Registry cleanup completed."
          exit 0

      - name: Install PythonVista
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = ".\python-installer.exe"
          $log = "$env:RUNNER_TEMP\pythonvista-install.log"

          $args = @(
            "/quiet"
            "/log `"$log`""
            "InstallAllUsers=1"
            "TargetDir=`"$env:PYTHON_ROOT`""
            "PrependPath=0"
            "Include_lib=1"
            "Include_exe=1"
            "Include_dev=1"
            "Include_pip=1"
            "Include_test=0"
          )

          Write-Host "Installing PythonVista to: $env:PYTHON_ROOT"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList ($args -join " ") `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($process.ExitCode -ne 0) {
            throw "PythonVista installer failed with exit code $($process.ExitCode)"
          }

          Write-Host "=== Installation directory ==="
          Get-ChildItem $env:PYTHON_ROOT -Force

          Write-Host "=== Standard library ==="
          if (!(Test-Path "$env:PYTHON_ROOT\Lib\os.py")) {
            throw "PythonVista standard library was not installed"
          }

          Write-Host "PythonVista installation succeeded."
          & "$env:PYTHON_ROOT\python.exe" --version

      - name: Upload PythonVista installer logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pythonvista-install-logs
          path: ${{ runner.temp }}\pythonvista-install*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $python = "$env:PYTHON_ROOT\python.exe"
          $stdlib = "$env:PYTHON_ROOT\Lib\os.py"

          Write-Host "Python path: $python"
          Write-Host "Standard library: $stdlib"

          if (!(Test-Path $python)) {
            throw "Python executable not found: $python"
          }

          if (!(Test-Path $stdlib)) {
            throw "Python standard library not found: $stdlib"
          }

          & $python --version

          & $python -c "import sys, os; print(sys.executable); print(sys.prefix); print(os.__file__)"

      - name: Install build requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $python = "$env:PYTHON_ROOT\python.exe"

          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed"
          }

          & $python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Build requirements installation failed"
          }

      - name: Pin compatibility versions
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps pyinstaller==6.22.3
          python -m pip install --force-reinstall curl-cffi==0.17.0

          python -m pip show pyinstaller
          python -m pip show curl-cffi

      - name: Verify PyInstaller
        shell: pwsh
        run: |
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__); print('Location:', PyInstaller.__file__)"

          python -c "from PyInstaller.utils.win32 import winmanifest; print('PyInstaller Windows modules OK')"

      - name: Prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python devscripts/make_lazy_extractors.py

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python -m bundle.pyinstaller

          if (!(Test-Path "dist/yt-dlp.exe")) {
            throw "yt-dlp.exe was not generated"
          }

          Rename-Item `
            "dist/yt-dlp.exe" `
            "yt-dlp_win7.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          .\dist\yt-dlp_win7.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp_win7_x64
          path: dist/yt-dlp_win7.exe
          if-no-files-found: error
          retention-days: 30
