name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2025

    env:
      PYTHONHOME: ""
      PYTHONPATH: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PythonVista 3.14.10
        shell: pwsh
        run: |
          $url = "https://github.com/adang1345/PythonVista/releases/download/v3.14.10/python-3.14.10-amd64-full.exe"
          Invoke-WebRequest $url -OutFile python-installer.exe

      - name: Install PythonVista
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Start-Process -FilePath ".\python-installer.exe" `
            -ArgumentList "/quiet InstallAllUsers=1 TargetDir=C:\Python314 PrependPath=1 Include_pip=1 Include_test=0" `
            -Wait

          if (!(Test-Path "C:\Python314\python.exe")) {
            throw "Python installation failed"
          }

      - name: Verify Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Environment ==="
          Get-ChildItem Env:PYTHON*

          Write-Host "=== Python executable ==="
          Get-Item C:\Python314\python.exe | Format-List *

          Write-Host "=== Python314 directory ==="
          Get-ChildItem C:\Python314 -Force |
            Select-Object Name, FullName, Length

          Write-Host "=== pyvenv.cfg files ==="

          Get-ChildItem C:\Python314,D:\a\youtube\youtube `
            -Filter pyvenv.cfg -Force -Recurse `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "FOUND: $($_.FullName)"
              Get-Content $_.FullName
            }

          Write-Host "=== Python executable information ==="

          C:\Python314\python.exe -c "import sys, os; print('executable:', sys.executable); print('_base_executable:', getattr(sys, '_base_executable', None)); print('prefix:', sys.prefix); print('base_prefix:', sys.base_prefix); print('exec_prefix:', sys.exec_prefix); print('base_exec_prefix:', sys.base_exec_prefix); print('cwd:', os.getcwd()); print('path:', *sys.path, sep='\n')"

          Write-Host "=== Python version ==="
          C:\Python314\python.exe --version

      - name: Install build requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          C:\Python314\python.exe -m venv C:\yt-dlp-build-venv

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python -m pip install --upgrade pip

          python -m pip install `
            -r bundle/requirements/pip.txt

          python -m pip install `
            -r bundle/requirements/win-x64-pyinstaller.txt

          python -m pip install `
            -r bundle/requirements/curl-cffi.txt

          python -m pip --version

      - name: Pin compatibility versions
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps pyinstaller==6.22.3
          python -m pip install --force-reinstall curl-cffi==0.17.0

          python -m pip show pyinstaller
          python -m pip show curl-cffi

      - name: Verify PyInstaller
        shell: pwsh
        run: |
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__); print('Location:', PyInstaller.__file__)"

          python -c "from PyInstaller.utils.win32 import winmanifest; print('PyInstaller Windows modules OK')"

      - name: Prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python devscripts/make_lazy_extractors.py

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & C:\yt-dlp-build-venv\Scripts\Activate.ps1

          python -m bundle.pyinstaller

          if (!(Test-Path "dist/yt-dlp.exe")) {
            throw "yt-dlp.exe was not generated"
          }

          Rename-Item `
            "dist/yt-dlp.exe" `
            "yt-dlp_win7.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          .\dist\yt-dlp_win7.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp_win7_x64
          path: dist/yt-dlp_win7.exe
          if-no-files-found: error
          retention-days: 30
