name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2025

    steps:
      # -----------------------------------------------
      # Checkout yt-dlp
      # -----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # -----------------------------------------------
      # Download PythonVista 3.12.10 x64
      # -----------------------------------------------
      - name: Download PythonVista 3.12.10
        shell: pwsh
        run: |
          $url = "https://github.com/adang1345/PythonVista/releases/download/v3.12.10/python-3.12.10-amd64-full.exe"

          Invoke-WebRequest $url -OutFile python-installer.exe

      # -----------------------------------------------
      # Install PythonVista
      # -----------------------------------------------
      - name: Install PythonVista
        shell: pwsh
        run: |
          $process = Start-Process .\python-installer.exe `
            -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "PythonVista installation failed: $($process.ExitCode)"
          }

      # -----------------------------------------------
      # Verify Python
      # -----------------------------------------------
      - name: Verify Python
        shell: pwsh
        run: |
          python --version

          python -c "import sys, struct; print(sys.executable); print(struct.calcsize('P') * 8)"

          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10), 'Wrong Python version'"

          python -c "import struct; assert struct.calcsize('P') * 8 == 64, 'Python is not 64-bit'"

      # -----------------------------------------------
      # Install build requirements
      # -----------------------------------------------
      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            -r bundle/requirements/pip.txt

          python -m pip install `
            -r bundle/requirements/win-x64-pyinstaller.txt

          python -m pip install `
            -r bundle/requirements/curl-cffi.txt

      # -----------------------------------------------
      # Pin compatibility versions
      # IMPORTANT:
      # Do NOT overwrite Windows 7 compatible PyInstaller!
      # -----------------------------------------------
      - name: Pin compatibility versions
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps curl-cffi==0.17.0

          python -m pip show pyinstaller

          python -m pip show curl-cffi

      # -----------------------------------------------
      # Verify PyInstaller installation
      # -----------------------------------------------
      - name: Verify PyInstaller
        shell: pwsh
        run: |
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__); print('Location:', PyInstaller.__file__)"

          python -c "from PyInstaller.utils.win32 import winmanifest; print('PyInstaller Windows modules OK')"

      # -----------------------------------------------
      # Prepare
      # -----------------------------------------------
      - name: Prepare
        shell: pwsh
        run: |
          python devscripts/make_lazy_extractors.py

      # -----------------------------------------------
      # Build executable
      # -----------------------------------------------
      - name: Build executable
        shell: pwsh
        run: |
          python -m bundle.pyinstaller

          if (!(Test-Path "dist/yt-dlp.exe")) {
            throw "yt-dlp.exe was not generated"
          }

          Rename-Item `
            "dist/yt-dlp.exe" `
            "yt-dlp_win7.exe"

      # -----------------------------------------------
      # Verify executable
      # -----------------------------------------------
      - name: Verify executable
        shell: pwsh
        run: |
          .\dist\yt-dlp_win7.exe --version

      # -----------------------------------------------
      # Upload artifact
      # -----------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp_win7_x64
          path: dist/yt-dlp_win7.exe
          if-no-files-found: error
          retention-days: 30
