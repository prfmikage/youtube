name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PythonVista 3.14.10
        shell: pwsh
        run: |
          $url = "https://github.com/adang1345/PythonVista/releases/download/v3.14.10/python-3.14.10-amd64-full.exe"
          Invoke-WebRequest $url -OutFile python-installer.exe

      - name: Install PythonVista
        shell: pwsh
        run: |
          Start-Process .\python-installer.exe `
            -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" `
            -Wait

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys, struct; print(sys.executable); print(struct.calcsize('P') * 8)"

      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            -r bundle/requirements/pip.txt

          python -m pip install `
            -r bundle/requirements/win-x64-pyinstaller.txt

          python -m pip install `
            -r bundle/requirements/curl-cffi.txt

      - name: Pin compatibility versions
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps pyinstaller==6.22.0

          python -m pip install --force-reinstall curl-cffi==0.17.0

          python -m pip show pyinstaller
          python -m pip show curl-cffi

      - name: Prepare
        shell: pwsh
        run: |
          python devscripts/make_lazy_extractors.py

      - name: Build executable
        shell: pwsh
        run: |
          python -m bundle.pyinstaller

          if (!(Test-Path "dist/yt-dlp.exe")) {
            throw "yt-dlp.exe was not generated"
          }

          Rename-Item `
            "dist/yt-dlp.exe" `
            "yt-dlp_win7.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          .\dist\yt-dlp_win7.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp_win7_x64
          path: dist/yt-dlp_win7.exe
          if-no-files-found: error
          retention-days: 30
